# CI skeleton seeded by `aios repo-bootstrap` (AIO-602). This repo owns it from here —
# the bootstrap never overwrites an existing ci.yml. The governance-gates job mirrors
# the aios-workspace invariants (ENGINEERING-CONSTITUTION.md §8): file-size cap and
# repo-boundary seams. Confidentiality scanning is isolated in leak-gate.yml so the private
# term set never reaches this PR-controlled workflow. This job also runs OGR09 (AIO-702):
# the skill-library integrity + licensing check ported from aios-workspace, which needs
# `npm ci` first so `@aiosbrain/foundation/internal/skill-scan` resolves.
name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: governance gates (size + boundaries + OGR09)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: File-size gate (default-deny, ratchet-only-down)
        run: node scripts/check-file-size.mjs
      - name: Repo-boundary gate
        run: node scripts/check-boundaries.mjs
      - name: Install dependencies (gui/server scope only, no lifecycle scripts)
        # OGR09 only needs @aiosbrain/foundation's skill-scan resolved (gui/server's own
        # dependency) — not the client's build toolchain (style-dictionary,
        # @bundled-es-modules/glob, both of which run `postinstall: patch-package`). A
        # governance-gates job runs before the leak/confidentiality gates below, so it
        # must not execute arbitrary third-party lifecycle scripts. Scoping to the
        # gui/server workspace + --ignore-scripts drops the install from 537 packages to
        # ~106 and neither postinstall-bearing package is pulled in. Verified:
        # `node validation/check-skill-library.mjs` still passes clean against this
        # narrower install.
        run: npm ci --ignore-scripts --workspace=gui/server
      - name: Skill-library integrity + licensing gate (OGR09)
        run: node validation/check-skill-library.mjs

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; elif [ -f package.json ]; then npm install; fi
      - name: Lint
        run: |
          if [ -f package.json ]; then npm run lint --if-present; else echo "no package.json — skipping lint"; fi

  test:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The live-server suites need a real AIOS toolkit checkout (NOTES.md "CI follow-up"):
      # without AIOS_TOOLKIT_DIR they fail with the toolkit-locate error by design.
      - name: Checkout AIOS toolkit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: aiosbrain/aios-workspace
          # tag cut/gui-freeze — repin to the v0.9.0 release tag once cut
          ref: d6dcdeb74a44c8424e85b0781f5f11d4e06a3dfa
          path: toolkit-checkout
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; elif [ -f package.json ]; then npm install; fi
      - name: Provision toolkit (deps + operator-loop dist)
        working-directory: toolkit-checkout
        run: |
          npm ci
          # compiled operator loop dist — needed by the inbox-capability suite
          npm run build:loop --if-present
      - name: Build client
        run: npm run build:client
      - name: Test
        env:
          AIOS_TOOLKIT_DIR: ${{ github.workspace }}/toolkit-checkout
        run: |
          if [ -f package.json ]; then npm run test --if-present; else echo "no package.json — skipping tests"; fi
